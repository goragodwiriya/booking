<aside data-component="sidebar"></aside>
<div class="main-content">
    <div>
        <header data-component="topbar"></header>
        <main class="content">
            <div class="card-groups">
                <header>
                    <div>
                        <h1 class="icon-valid" data-i18n>Booking approvals</h1>
                        <p data-i18n>Review pending and processed room reservation requests</p>
                    </div>
                </header>
                <div class="content-body">
                    <div class="tablebody">
                        <table class="table border fullwidth" data-table="bookingApprovals" data-source="api/booking/approvals" data-default-sort="create_date desc"
                               data-page-size="25" data-search-columns="room_name,topic,comment,reason" data-action-url="api/booking/approvals/action" data-row-actions='{
                                "review": {
                                  "label": "Review",
                                  "className": "btn btn-warning icon-search"
                                }
                              }'>
                            <thead>
                                <tr>
                                    <th data-field="member_id" data-sort="member_id" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                                        data-format="lookup" data-i18n>{LNG_Requester}</th>
                                    <th data-field="room_id" data-sort="room_id" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                                        data-formatter="formatRoomWithImage" data-i18n>{LNG_Room}</th>
                                    <th data-field="topic" data-template="<span class='two_line'>${topic}</span>" data-i18n>{LNG_Topic}</th>
                                    <th data-field="reservation_text" data-sort="begin" class="center" data-cell-class="center" data-i18n> {LNG_Reservation period}</th>
                                    <th data-field="created_at" data-sort="created_at" data-format="datetime" data-filter="true" data-type="daterange" data-range-names="from,to"
                                        data-range-presets="today,7d,30d,thismonth,lastmonth" data-label="Date" data-i18n>{LNG_Created}</th>
                                    <th data-field="status" data-sort="status" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                                        data-formatter="formatTableOptionStatus" class="center" data-cell-class="center" data-i18n> {LNG_Status}</th>
                                    <th data-field="reason" data-template="<span class='two_line'>${reason}</span>" data-i18n>{LNG_Reason}</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer class="footer">
        <p class="center">&copy; 2026 Admin Framework - Powered by <a href="https://nowjs.net">Now.js</a></p>
    </footer>
</div>
